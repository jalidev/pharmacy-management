<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaCare — Pharmacy Management</title>
<style>
  :root{--bg:#0b0d10;--panel:#12151b;--panel2:#171b23;--line:#232936;--txt:#e8ecf3;--dim:#8b93a3;--lime:#c8f542;--red:#ff5d5d;--amber:#ffb84d;--blue:#5aa2ff;--radius:14px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px}.logo span{color:var(--lime)}
  .stats{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:12.5px;color:var(--dim)}
  .chip b{color:var(--txt);font-variant-numeric:tabular-nums}
  .chip.warn b{color:var(--amber)}.chip.bad b{color:var(--red)}
  main{padding:22px;max-width:1200px;margin:0 auto}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--txt);font-size:14px;outline:none}
  .toolbar input:focus{border-color:var(--lime)}
  .filters{display:flex;gap:8px}
  .filters button{border:1px solid var(--line);background:var(--panel);color:var(--dim);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
  .filters button.active{background:var(--lime);color:#0b0d10;border-color:var(--lime)}
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th{color:var(--dim);text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--line);background:var(--panel2)}
  td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.02)}
  .pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .ok{background:rgba(200,245,66,.13);color:var(--lime)}
  .low{background:rgba(255,184,77,.13);color:var(--amber)}
  .exp{background:rgba(255,107,107,.15);color:var(--red)}
  .sell{background:transparent;border:1px solid var(--lime);color:var(--lime);padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:12.5px}
  .sell:hover{background:var(--lime);color:#0b0d10}
  .sell:disabled{opacity:.3;cursor:default}
  .formcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:22px;display:none}
  .formcard.show{display:block}
  .formcard h3{margin-bottom:14px;font-size:16px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .fgrid input,.fgrid select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;width:100%}
  .fgrid label{display:block;color:var(--dim);font-size:11.5px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .addbtn{background:var(--lime);color:#0b0d10;border:none;padding:11px 22px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:14px}
  .toggle-add{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13.5px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--lime);color:#0b0d10;font-weight:700;padding:12px 22px;border-radius:999px;transition:transform .25s;z-index:60;font-size:14px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .num{font-variant-numeric:tabular-nums}
  .suppliers{margin-top:26px}
  .suppliers h3{margin-bottom:12px;font-size:16px}
  .supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .sup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .sup b{display:block;margin-bottom:4px}
  .sup span{color:var(--dim);font-size:12.5px;display:block}
  @media(max-width:760px){.stats{margin-left:0}table{font-size:12.5px}th,td{padding:9px 8px}}
</style>
</head>
<body>
<div style="background:#c8f542;color:#0b0d10;font:600 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 12px;letter-spacing:.3px">DEMO — sample data only, not a real service · <span dir="rtl">نموذج تجريبي — بيانات وهمية</span></div>
<header>
  <div class="logo">Pharma<span>Care</span></div>
  <div class="stats">
    <div class="chip">Stock value <b id="s-value">$0</b></div>
    <div class="chip warn">Low stock <b id="s-low">0</b></div>
    <div class="chip bad">Expiring ≤ 60d <b id="s-exp">0</b></div>
    <div class="chip">Sold today <b id="s-sold">0</b></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="q" placeholder="Search medicine, category or supplier..." oninput="render()">
    <div class="filters">
      <button class="active" data-f="all" onclick="setF('all',this)">All</button>
      <button data-f="low" onclick="setF('low',this)">Low stock</button>
      <button data-f="exp" onclick="setF('exp',this)">Expiring</button>
    </div>
    <button class="toggle-add" onclick="document.querySelector('.formcard').classList.toggle('show')">+ Add medicine</button>
  </div>

  <div class="formcard" id="addForm">
    <h3>New medicine</h3>
    <div class="fgrid">
      <div><label>Name</label><input id="f-name" placeholder="Paracetamol 500mg"></div>
      <div><label>Category</label><input id="f-cat" placeholder="Analgesic"></div>
      <div><label>Supplier</label><input id="f-sup" placeholder="MedSupply Co"></div>
      <div><label>Unit price ($)</label><input id="f-price" type="number" min="0" step="0.1" placeholder="4.50"></div>
      <div><label>Stock</label><input id="f-stock" type="number" min="0" placeholder="100"></div>
      <div><label>Expiry date</label><input id="f-exp" type="date"></div>
    </div>
    <button class="addbtn" onclick="addMed()">Save medicine</button>
  </div>

  <table>
    <thead><tr><th>Medicine</th><th>Category</th><th>Price</th><th>Stock</th><th>Expiry</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="suppliers">
    <h3>Suppliers & balances</h3>
    <div class="supgrid" id="sups"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const MEDS=[
 {name:"Paracetamol 500mg",cat:"Analgesic",sup:"MedSupply Co",price:0.45,stock:420,exp:"2027-03-14"},
 {name:"Amoxicillin 250mg",cat:"Antibiotic",sup:"PharmaDist",price:1.20,stock:85,exp:"2026-08-01"},
 {name:"Ibuprofen 400mg",cat:"Analgesic",sup:"MedSupply Co",price:0.60,stock:34,exp:"2026-12-20"},
 {name:"Cetirizine 10mg",cat:"Antihistamine",sup:"HealthLine",price:0.35,stock:210,exp:"2027-01-05"},
 {name:"Omeprazole 20mg",cat:"Antacid",sup:"PharmaDist",price:0.90,stock:12,exp:"2026-07-18"},
 {name:"Metformin 850mg",cat:"Antidiabetic",sup:"HealthLine",price:0.55,stock:160,exp:"2027-05-30"},
 {name:"ORS Sachets",cat:"Rehydration",sup:"MedSupply Co",price:0.25,stock:9,exp:"2026-06-25"},
 {name:"Vitamin D3 1000IU",cat:"Supplement",sup:"VitaSource",price:0.70,stock:300,exp:"2028-02-11"},
 {name:"Azithromycin 500mg",cat:"Antibiotic",sup:"PharmaDist",price:2.40,stock:48,exp:"2026-12-31"},
 {name:"Salbutamol Inhaler",cat:"Respiratory",sup:"HealthLine",price:5.80,stock:22,exp:"2027-09-09"},
];
const LOW=25, EXPIRY_DAYS=60;
let filter="all", soldToday=0;
const SUPS=[
 {name:"MedSupply Co",phone:"+235 66 20 41 07",balance:"$1,240 payable",terms:"Net 30"},
 {name:"PharmaDist",phone:"+235 63 90 12 55",balance:"$860 payable",terms:"Net 15"},
 {name:"HealthLine",phone:"+235 62 44 78 90",balance:"Settled",terms:"Net 30"},
 {name:"VitaSource",phone:"+235 99 31 02 76",balance:"$310 payable",terms:"Cash on delivery"},
];
const $=id=>document.getElementById(id);
const money=n=>"$"+n.toFixed(2);
function daysTo(d){return Math.ceil((new Date(d)-new Date())/864e5)}
function status(m){const d=daysTo(m.exp);if(d<0)return"expired";if(d<=EXPIRY_DAYS)return"exp";if(m.stock<=LOW)return"low";return"ok"}
function setF(f,btn){filter=f;document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}
function render(){
 const q=$("q").value.toLowerCase();
 const rows=MEDS.map((m,i)=>({m,i})).filter(({m})=>{
   const st=status(m);
   if(filter==="low"&&m.stock>LOW)return false;
   if(filter==="exp"&&daysTo(m.exp)>EXPIRY_DAYS)return false;
   return (m.name+m.cat+m.sup).toLowerCase().includes(q)});
 $("rows").innerHTML=rows.map(({m,i})=>{const st=status(m);
  return`<tr><td><b>${m.name}</b></td><td>${m.cat}</td><td class="num">${money(m.price)}</td>
  <td class="num">${m.stock}</td><td class="num">${m.exp} <span style="color:var(--dim);font-size:11px">(${daysTo(m.exp)}d)</span></td>
  <td><span class="pill ${st==="expired"?"exp":st}">${st==="expired"?"Expired":st==="exp"?"Expiring":st==="low"?"Low stock":"OK"}</span></td>
  <td><button class="sell" ${m.stock<=0||st==="expired"?"disabled":""} onclick="sell(${i})">Sell</button></td></tr>`}).join("")
  ||'<tr><td colspan="7" style="color:var(--dim)">No medicines match</td></tr>';
 const val=MEDS.reduce((s,m)=>s+m.price*m.stock,0);
 $("s-value").textContent="$"+Math.round(val).toLocaleString();
 $("s-low").textContent=MEDS.filter(m=>m.stock<=LOW).length;
 $("s-exp").textContent=MEDS.filter(m=>{const d=daysTo(m.exp);return d>=0&&d<=EXPIRY_DAYS}).length;
 $("s-sold").textContent=soldToday;
 $("sups").innerHTML=SUPS.map(s=>`<div class="sup"><b>${s.name}</b><span>${s.phone}</span><span>${s.balance} · ${s.terms}</span></div>`).join("");
}
function sell(i){const m=MEDS[i];if(m.stock<=0)return;if(status(m)==="expired"){toast("Cannot sell expired stock");return}m.stock--;soldToday++;render();toast("Sold 1 × "+m.name)}
function addMed(){
 const name=$("f-name").value.trim(),price=+$("f-price").value,stock=+$("f-stock").value,exp=$("f-exp").value;
 if(!name||!price||!exp)return toast("Name, price and expiry are required");
 MEDS.unshift({name,cat:$("f-cat").value.trim()||"General",sup:$("f-sup").value.trim()||"—",price,stock:stock||0,exp});
 $("addForm").classList.remove("show");
 ["f-name","f-cat","f-sup","f-price","f-stock","f-exp"].forEach(id=>$(id).value="");
 render();toast("Added "+name);
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
render();
</script>
</body>
</html>
